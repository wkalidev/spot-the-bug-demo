name: Spot the Bug

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  spot-the-bug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      # Slither compiles through forge, so Foundry must be on the runner first.
      - uses: foundry-rs/foundry-toolchain@v1

      - uses: wkalidev/spot-the-bug-action@feat/low-only-and-skip-summary
        with:
          fail-on: high

      # Test only: print the job summaries written by earlier steps.
      - name: Show job summaries
        if: always()
        run: cat "$RUNNER_TEMP"/_runner_file_commands/step_summary_* 2>/dev/null || echo "no summary files"
