name: Spot the Bug

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  spot-the-bug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      # Slither compiles through forge, so Foundry must be on the runner first.
      - uses: foundry-rs/foundry-toolchain@v1

      - uses: wkalidev/spot-the-bug-action@feat/update-stale-comment
        with:
          fail-on: high
